services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hilight
      POSTGRES_PASSWORD: hilight
      POSTGRES_DB: hilight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hilight -d hilight"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hilight:hilight@db:5432/hilight
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
